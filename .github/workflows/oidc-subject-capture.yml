# Throwaway diagnostic — NOT a deploy workflow.
#
# Purpose: capture the exact OIDC token `sub` and `aud` claims GitHub emits
# for a job on this repo that declares `environment: production`. No run
# has ever produced this subject — deploy.yml's own production path is
# gated behind this same environment and has never completed one (the one
# prior attempt, on a since-deleted branch, was rejected by the
# environment's branch policy before it produced a token). Cloud's IAM
# trust policy does a `StringEquals` match against both claims, literal,
# no wildcard, so this proves the exact strings before anything real
# depends on them.
#
# Deliberately does nothing else:
#   - No `aws-actions/configure-aws-credentials`, no AWS calls of any kind.
#   - No inputs, so there is nothing caller-supplied to interpolate into a
#     `run:` block — not a rule to remember, just nothing to interpolate.
#   - The minted ID token is never bound to a shell variable — it's piped
#     straight from curl through jq/cut, so there's nothing token-shaped
#     for a future `set -x` to expand. This matters because the repo is
#     public and this run is retained permanently: masking is the backup
#     control here, not the only one. The one thing that does reach a
#     variable is the base64url *payload* segment alone (claims, no
#     signature) purely to compute padding — detached from its signature
#     it can't authenticate as the token, so it doesn't reopen the same
#     hazard. The runner-supplied request token is masked as defense in
#     depth since it's an existing env var (not something this script
#     mints) that still appears inline in the curl command.
#   - Only ever prints the decoded `sub`/`aud` claims, nothing else.
#
# This is not `deploy.yml` with `stage=production` — it is a separate,
# minimal probe. Delete this file once the subject has been confirmed; it
# has no ongoing purpose.

name: OIDC subject capture (throwaway diagnostic)

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    capture-subject:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Request OIDC token and print decoded sub/aud only
              run: |
                  set -euo pipefail

                  if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
                      echo "::error::OIDC token request vars not present — check permissions.id-token: write." >&2
                      exit 1
                  fi

                  # Runner-supplied request token — mask as defense in
                  # depth even though it's an existing env var, not
                  # something this script mints. It appears inline in the
                  # curl command below either way.
                  echo "::add-mask::${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"

                  # The minted ID token itself is NEVER bound to a shell
                  # variable. This repo is public and this run is
                  # retained permanently, so if anyone later adds `set -x`
                  # while debugging this job, there must be nothing
                  # token-shaped for it to expand — piping avoids that
                  # regardless of masking. Same audience
                  # aws-actions/configure-aws-credentials requests by
                  # default, so this reflects the subject the real deploy
                  # job would present to AWS.
                  payload_b64url=$(curl -fsS \
                          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
                      | jq -r '.value // empty' \
                      | cut -d '.' -f2)

                  if [ -z "$payload_b64url" ]; then
                      echo "::error::Token response had no .value — check the step's exit status above." >&2
                      exit 1
                  fi

                  # Only the base64url *payload* segment — the claims,
                  # with no signature — ever reaches a variable, to
                  # compute padding. Detached from its signature this
                  # can't authenticate as the token, so binding it here
                  # doesn't reintroduce the hazard above; it's the same
                  # information we're about to print regardless.
                  payload_b64=$(echo -n "$payload_b64url" | tr '_-' '/+')
                  case $(( ${#payload_b64} % 4 )) in
                      2) payload_b64="${payload_b64}==" ;;
                      3) payload_b64="${payload_b64}=" ;;
                  esac

                  decoded=$(echo "$payload_b64" | base64 -d 2>/dev/null)
                  sub=$(echo "$decoded" | jq -r '.sub // empty')
                  aud=$(echo "$decoded" | jq -r '.aud // empty')

                  if [ -z "$sub" ] || [ -z "$aud" ]; then
                      echo "::error::Decoded token payload missing sub or aud." >&2
                      exit 1
                  fi

                  echo "OIDC claims for environment: production on this repo:"
                  echo "sub=$sub"
                  echo "aud=$aud"
